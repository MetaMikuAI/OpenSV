[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensv-train"
version = "0.1.0"
description = "OpenSV training backend"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26", "scipy>=1.14", "praat-parselmouth>=0.4.5"]
license = "GPL-3.0-only"

[project.optional-dependencies]
cuda = ["torch>=2.6"]

[dependency-groups]
cpu = ["torch>=2.6"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { extra = "cuda" }]]

[project.scripts]
opensv-gui = "opensv_train.gui:main"
opensv-prepare = "opensv_train.prepare:main"

[tool.setuptools.package-data]
opensv_train = ["web/*.html"]

[tool.setuptools.packages.find]
include = ["opensv_train*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'", group = "cpu" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
