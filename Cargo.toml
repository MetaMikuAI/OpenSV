[package]
name = "opensv"
version = "0.1.0"
edition = "2024"
description = "Singing synthesis in Rust"
license = "GPL-3.0-only"
default-run = "opensv"

[[bin]]
name = "opensv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rustfft = "6"
hound = "3"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
[profile.release]
lto = "thin"
codegen-units = 1

